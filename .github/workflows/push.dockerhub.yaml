name: Build & Push - Docker Image
on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        description: Choose a release version type
        options:
          - latest
          - custom
        required: true

env:
  TARGET_BRANCH: ${{ github.ref_name }}

  # Docker
  DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

  # Image Details
  IMAGE_NAME: "nebula"
jobs:
  base-setup:
    name: Base Setup For Building Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.setup_env_variables.outputs.IMAGE_TAG }}
      skip_push: ${{ steps.setup_env_variables.outputs.SKIP_PUSH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set-up Env Variables
        id: setup_env_variables
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ env.TARGET_BRANCH }}" == "main" && "${{ github.event.inputs.release }}" == "latest" ]]; then
              echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
              echo "SKIP_PUSH=false" >> $GITHUB_OUTPUT
          elif [[ "${{ env.TARGET_BRANCH }}" == "dev" && "${{ github.event.inputs.release }}" == "latest" ]]; then
              echo "IMAGE_TAG=dev" >> $GITHUB_OUTPUT
              echo "SKIP_PUSH=false" >> $GITHUB_OUTPUT
          elif [[ -n "$VERSION" && "${{ github.event.inputs.release }}" == "custom" ]]; then
              echo "Package version = $VERSION"
              echo "IMAGE_TAG=v$VERSION" >> $GITHUB_OUTPUT
              echo "SKIP_PUSH=false" >> $GITHUB_OUTPUT
          else
              echo "SKIP_PUSH=true" >> $GITHUB_OUTPUT
              echo "Please choose release type to deploy!"
          fi

  server:
    name: "Build & Push Server Docker Images"
    needs: [base-setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    env:
      SKIP_PUSH: ${{ needs.base-setup.outputs.skip_push }}

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{env.IMAGE_NAME}}

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_ACCESS_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.DOCKER_USERNAME }}/${{env.IMAGE_NAME}}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
        env:
          DOCKER_BUILDKIT: 1

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.IMAGE_NAME}}-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - server
      - base-setup

    env:
      BASE_IMAGE_TAG: ${{ needs.base-setup.outputs.image_tag }}
      SKIP_PUSH: ${{ needs.base-setup.outputs.skip_push }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{env.IMAGE_NAME}}-digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        if: env.SKIP_PUSH == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{env.IMAGE_NAME}}
          tags: |
            type=raw,value=${{ env.BASE_IMAGE_TAG }}

      - name: Create manifest list and push
        if: env.SKIP_PUSH == 'false'
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.DOCKER_USERNAME }}/${{env.IMAGE_NAME}}@sha256:%s ' *)

  publish-swagger-docker:
    name: Deploy OpenApi Swagger UI
    environment: Production
    runs-on: ubuntu-latest
    needs:
      - base-setup
    env:
      BASE_IMAGE_TAG: ${{ needs.base-setup.outputs.image_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_ACCESS_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: deployment
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./oas/Dockerfile
          push: true
          tags: ${{env.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}-swagger:${{env.BASE_IMAGE_TAG}}
